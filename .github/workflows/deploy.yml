name: Deploy Rohit Sahani Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build or assemble production bundle
        run: |
          if npm install --legacy-peer-deps && npm run build; then
            echo "Built fresh production bundle with Vite"
          else
            echo "Using pre-compiled production bundle from public/gh-pages"
            mkdir -p dist/assets dist/gh-pages
            cp -r public/assets/* dist/assets/ 2>/dev/null || true
            cp public/gh-pages/app.js dist/gh-pages/app.js
            cp public/gh-pages/app.css dist/gh-pages/app.css
            touch dist/.nojekyll
            cat << 'EOF' > dist/index.html
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Rohit Sahani Portfolio — AI Engineer | Software Developer | Creative Builder</title>
              <meta name="application-name" content="Rohit Sahani Portfolio" />
              <meta name="author" content="Rohit Sahani" />
              <meta name="description" content="Personal portfolio of Rohit Sahani — BIT student, AI engineer in progress, and software developer in Biratnagar, Nepal building practical AI-powered applications and modern web experiences." />
              <meta property="og:site_name" content="Rohit Sahani Portfolio" />
              <meta property="og:title" content="Rohit Sahani Portfolio — AI Engineer | Software Developer | Creative Builder" />
              <meta property="og:description" content="Personal portfolio of Rohit Sahani — BIT student, AI engineer in progress, and software developer in Biratnagar, Nepal building practical AI-powered applications and modern web experiences." />
              <meta property="og:type" content="website" />
              <meta name="twitter:card" content="summary_large_image" />
              <meta name="twitter:title" content="Rohit Sahani Portfolio — AI Engineer | Software Developer | Creative Builder" />
              <meta name="twitter:description" content="Personal portfolio of Rohit Sahani — BIT student, AI engineer in progress, and software developer in Biratnagar, Nepal building practical AI-powered applications and modern web experiences." />
              <link rel="preconnect" href="https://fonts.googleapis.com" />
              <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
              <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@600;700&family=Bebas+Neue&family=Oswald:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
              <link rel="stylesheet" crossorigin href="./gh-pages/app.css" />
              <script type="module" crossorigin src="./gh-pages/app.js"></script>
            </head>
            <body class="bg-[#09090b] text-white antialiased selection:bg-[#b81d2a] selection:text-white">
              <div id="root"></div>
            </body>
          </html>
          EOF
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
